name: Audit grammar example quality

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-grammar-examples.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print grammar examples that still rely on auto filler
        run: |
          node <<'NODE'
          global.window = {};
          [
            './data/base.js',
            './data/n5.js','./data/n4.js','./data/n3.js','./data/n2.js','./data/n1.js',
            './data/extra-base.js',
            './data/extra-n5.js','./data/extra-n4.js','./data/extra-n3.js','./data/extra-n2.js','./data/extra-n1.js',
            './data/grammar-examples-base.js',
            './data/grammar-examples-n5.js','./data/grammar-examples-n4.js','./data/grammar-examples-n3.js','./data/grammar-examples-n2.js','./data/grammar-examples-n1.js',
            './data/grammar-examples-auto.js'
          ].forEach(f => require(f));
          for (const level of ['N5','N4','N3','N2','N1']) {
            for (const item of window.JLPT_DATA.grammar[level] || []) {
              const auto = (item.examples || []).filter(ex => /^补充/.test(ex.covers || ''));
              if (!auto.length) continue;
              console.log([level,item.id,item.title,item.connection,'BASE=' + (item.examples[0]?.jp || ''),'AUTO=' + auto.map(x=>x.jp).join(' || ')].join('\t'));
            }
          }
          NODE
