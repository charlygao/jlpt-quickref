name: Audit vocabulary examples

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-vocab-examples.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print vocabulary examples
        run: |
          node <<'NODE'
          global.window = {};
          [
            './data/base.js',
            './data/n5.js','./data/n4.js','./data/n3.js','./data/n2.js','./data/n1.js',
            './data/extra-base.js',
            './data/extra-n5.js','./data/extra-n4.js','./data/extra-n3.js','./data/extra-n2.js','./data/extra-n1.js',
            './data/full-vocab.js'
          ].forEach(f => require(f));

          const seenExample = new Map();
          let total = 0;
          for (const level of ['N5','N4','N3','N2','N1']) {
            let count = 0;
            for (const item of window.JLPT_DATA.vocab[level] || []) {
              if (!item.example?.jp) continue;
              total++; count++;
              const jp = item.example.jp;
              const flags = [];
              if ([...jp].length <= 8) flags.push('SHORT');
              if (/^(私は|これ|それ|あれ|今日|明日|昨日)/.test(jp)) flags.push('BASIC_START');
              if (/です。$/.test(jp) && [...jp].length <= 14) flags.push('BARE_DESU');
              if (/ます。$/.test(jp) && [...jp].length <= 14) flags.push('BARE_MASU');
              if (seenExample.has(jp)) flags.push('DUP:' + seenExample.get(jp));
              else seenExample.set(jp, `${level}/${item.word}`);
              console.log([
                level,item.id,item.word,item.reading,item.pos,item.meaning,
                'JP=' + jp,'ZH=' + item.example.zh,'FLAGS=' + flags.join(',')
              ].join('\t'));
            }
            console.error(`${level}: ${count} vocabulary examples`);
          }
          console.error(`TOTAL: ${total} vocabulary examples`);
          NODE
