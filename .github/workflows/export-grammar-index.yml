name: Export grammar index

on:
  push:
    paths:
      - '.github/workflows/export-grammar-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print grammar index
        run: |
          node <<'NODE'
          global.window = {};
          [
            './data/base.js',
            './data/n5.js','./data/n4.js','./data/n3.js','./data/n2.js','./data/n1.js',
            './data/extra-base.js','./data/extra-n5.js','./data/extra-n4.js','./data/extra-n3.js','./data/extra-n2.js','./data/extra-n1.js'
          ].forEach(require);
          for (const level of ['N5','N4','N3','N2','N1']) {
            for (const item of window.JLPT_DATA.grammar[level] || []) {
              console.log(JSON.stringify({id:item.id,level,title:item.title,connection:item.connection,examples:item.examples||[]}));
            }
          }
          NODE
