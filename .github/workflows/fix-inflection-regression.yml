name: Fix inflection regression

on:
  push:
    paths: ['.github/workflows/fix-inflection-regression.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch frontend guard and regression tests
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          text = app.read_text()
          pattern = re.compile(
              r"  function isInflectable\(item\) \{\n"
              r"    const type = detailedType\(item\);\n"
              r"    return /五段动词\|一段动词\|サ变动词\|カ变动词\|名词・サ变\|い形容词\|な形容词/\.test\(type\);\n"
              r"  \}"
          )
          replacement = """  function isInflectable(item) {
            // Render the button only when the conjugator can actually produce
            // rows. This prevents a malformed/unknown POS from creating a
            // clickable control whose modal immediately returns empty.
            return conjugationRows(item).length > 0;
          }"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'isInflectable replacement count: {count}')
          app.write_text(text)

          pages = Path('.github/workflows/pages.yml')
          text = pages.read_text()

          marker = "expectPos('N5', '開ける', 'あける', /一段动词.*他动词/);"
          if "expectPos('N3', '成長'" not in text:
              pos_lines = (
                  marker + "\n"
                  "          expectPos('N3', '成長', 'せいちょう', /名词・サ变.*自动词/);\n"
                  "          expectPos('N5', '結婚', 'けっこん', /名词・サ变.*自动词/);\n"
                  "          expectPos('N5', '質問', 'しつもん', /名词・サ变.*他动词/);"
              )
              if marker not in text:
                  raise SystemExit('POS regression insertion point not found')
              text = text.replace(marker, pos_lines, 1)

          marker = "expectForm({word:'勉強',reading:'べんきょう',pos:'名词・サ变'}, '辞书形', '勉強する');"
          if "expectForm(vocabItem('N3', '成長'" not in text:
              form_lines = (
                  marker + "\n"
                  "          expectForm(vocabItem('N3', '成長', 'せいちょう'), '辞书形', '成長する');\n"
                  "          expectForm(vocabItem('N3', '成長', 'せいちょう'), 'ます形', '成長します');"
              )
              if marker not in text:
                  raise SystemExit('conjugation regression insertion point not found')
              text = text.replace(marker, form_lines, 1)

          pages.write_text(text)
          PY
          node --check app.js

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/pages.yml
          git commit -m 'fix: guard conjugation buttons and test suru nouns'
          git pull --rebase origin main
          git push origin HEAD:main
