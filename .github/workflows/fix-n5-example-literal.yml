name: Fix N5 example literal
on:
  push:
    paths: ['.github/workflows/fix-n5-example-literal.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace accidental runtime string expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/vocab-examples-highfreq-n5.js')
          s = p.read_text(encoding='utf-8')
          old = "'駅まで歩いて十分钟ぐらいかかります。'.replace('分钟','分')"
          new = "'駅まで歩いて十分ぐらいかかります。'"
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check data/vocab-examples-highfreq-n5.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocab-examples-highfreq-n5.js
          git commit -m 'content: make N5 example fully literal'
          git pull --rebase origin main
          git push origin HEAD:main
