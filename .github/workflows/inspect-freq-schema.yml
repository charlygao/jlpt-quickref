name: Inspect frequency schema
on:
  push:
    paths: ['.github/workflows/inspect-freq-schema.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download dictionary
        run: |
          curl -L --fail --retry 3 -o /tmp/tomoshi.db.zst https://github.com/tomoshi-app/tomoshi-dict-data/releases/download/v2026-08-12/tomoshi-dict-open.db.zst
          zstd -d /tmp/tomoshi.db.zst -o /tmp/tomoshi.db
      - name: Inspect frequency schema
        run: |
          sqlite3 /tmp/tomoshi.db '.schema freq_rank'
          sqlite3 -header -column /tmp/tomoshi.db 'SELECT * FROM freq_rank LIMIT 15;'
