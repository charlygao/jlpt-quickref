name: Materialize reviewed grammar details

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/materialize-grammar-details.yml"
      - "data/generated/grammar-details.js.gz.part-*"

permissions:
  contents: write

concurrency:
  group: materialize-grammar-details
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate detail data
        run: |
          set -euo pipefail
          test "$(find data/generated -maxdepth 1 -name 'grammar-details.js.gz.part-*' | wc -l)" -eq 8
          cat data/generated/grammar-details.js.gz.part-* > /tmp/grammar-details.js.gz
          gzip -t /tmp/grammar-details.js.gz
          gzip -dc /tmp/grammar-details.js.gz > data/grammar-details.js
          echo '7f04d0b260daa6f493eb16be4854d91545711369f1c7e579e47f0b3c0b3edc6b  data/grammar-details.js' | sha256sum -c -
          node --check data/grammar-details.js
          node <<'NODE'
          const fs = require('fs');
          global.window = {};
          const files = [...fs.readFileSync('index.html', 'utf8').matchAll(/<script\s+src="([^"]+)"/g)]
            .map(match => match[1])
            .filter(src => src.startsWith('data/'));
          files.forEach(file => require(`./${file}`));
          const items = Object.values(window.JLPT_DATA.grammar).flat();
          if (items.length !== 388) throw new Error(`Expected 388 grammar items, got ${items.length}`);
          if (window.JLPT_GRAMMAR_DETAIL_COUNT !== items.length) throw new Error('Grammar detail coverage mismatch');
          for (const item of items) {
            const d = item.detail;
            if (!d?.overview || !d?.formation || !d?.category || !d?.register?.label || d.usages.length < 3 || d.cautions.length < 2 || d.specialCases.length < 1) {
              throw new Error(`Incomplete grammar detail: ${item.id} ${item.title}`);
            }
          }
          console.log(`Grammar details validated: ${items.length}/${items.length}`);
          NODE

      - name: Commit materialized source
        run: |
          if git diff --quiet -- data/grammar-details.js; then
            echo 'Materialized source is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grammar-details.js
          git commit -m 'data(grammar): materialize reviewed details for all 388 points'
          git push origin HEAD:main
