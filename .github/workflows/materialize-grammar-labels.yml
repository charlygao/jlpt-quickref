name: Materialize grammar example labels
on:
  push:
    paths: ['.github/workflows/materialize-grammar-labels.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact labels from grammar connection metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          global.window = {};
          [
            './data/base.js',
            './data/n5.js','./data/n4.js','./data/n3.js','./data/n2.js','./data/n1.js',
            './data/extra-base.js',
            './data/extra-n5.js','./data/extra-n4.js','./data/extra-n3.js','./data/extra-n2.js','./data/extra-n1.js',
            './data/grammar-examples-base.js',
            './data/grammar-examples-n5.js','./data/grammar-examples-n4.js','./data/grammar-examples-n3.js',
            './data/grammar-examples-n2.js','./data/grammar-examples-n1.js',
            './data/grammar-examples-curated.js'
          ].forEach(f => require(f));

          const rows = [];
          for (const level of ['N5','N4','N3','N2','N1']) {
            for (const item of window.JLPT_DATA.grammar[level] || []) {
              for (const ex of item.examples || []) {
                if (!ex.covers) rows.push([level,item.id,ex.jp,item.connection]);
              }
            }
          }
          if (rows.some(x => !x[3])) throw new Error('A grammar item lacks connection metadata');

          const out = [
            '// Explicit labels for original grammar examples, copied from reviewed connection metadata.',
            '// No label inference or example generation is performed at runtime.',
            '(() => {',
            '  const DATA = window.JLPT_DATA;',
            `  const rows = ${JSON.stringify(rows)};`,
            '  for (const [level,id,jp,covers] of rows) {',
            '    const item = (DATA.grammar[level] || []).find(x => x.id === id);',
            '    const ex = item?.examples?.find(x => x.jp === jp);',
            '    if (ex) ex.covers = covers;',
            '  }',
            '})();',
            ''
          ].join('\n');
          fs.writeFileSync('data/grammar-example-labels.js', out);
          console.log(`Materialized ${rows.length} grammar-example labels from connection metadata.`);
          NODE
          node --check data/grammar-example-labels.js
      - name: Commit static labels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grammar-example-labels.js
          git commit -m 'content: use reviewed grammar connections as static labels'
          git pull --rebase origin main
          git push origin HEAD:main
