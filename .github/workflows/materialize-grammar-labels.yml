name: Materialize grammar example labels
on:
  push:
    paths: ['.github/workflows/materialize-grammar-labels.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact labels from the previously reviewed state
        run: |
          git show 91de89c08358cc7291ea0d8ac61ceb3d04a8b424:data/grammar-examples-auto.js > /tmp/old-reviewed-labeler.js
          node <<'NODE'
          const fs = require('fs');
          global.window = {};
          [
            './data/base.js',
            './data/n5.js','./data/n4.js','./data/n3.js','./data/n2.js','./data/n1.js',
            './data/extra-base.js',
            './data/extra-n5.js','./data/extra-n4.js','./data/extra-n3.js','./data/extra-n2.js','./data/extra-n1.js',
            './data/grammar-examples-base.js',
            './data/grammar-examples-n5.js','./data/grammar-examples-n4.js','./data/grammar-examples-n3.js',
            './data/grammar-examples-n2.js','./data/grammar-examples-n1.js',
            './data/grammar-examples-curated.js'
          ].forEach(f => require(f));

          const missing = [];
          for (const level of ['N5','N4','N3','N2','N1']) {
            for (const item of window.JLPT_DATA.grammar[level] || []) {
              for (const ex of item.examples || []) {
                if (!ex.covers) missing.push({level,id:item.id,jp:ex.jp});
              }
            }
          }

          require('/tmp/old-reviewed-labeler.js');
          const byKey = new Map();
          for (const level of ['N5','N4','N3','N2','N1']) {
            for (const item of window.JLPT_DATA.grammar[level] || []) {
              for (const ex of item.examples || []) byKey.set(`${level}\0${item.id}\0${ex.jp}`, ex.covers || '');
            }
          }

          const rows = missing.map(x => [x.level,x.id,x.jp,byKey.get(`${x.level}\0${x.id}\0${x.jp}`)]);
          const bad = rows.filter(x => !x[3]);
          if (bad.length) throw new Error(`Failed to materialize ${bad.length} labels`);

          const out = [
            '// Explicit labels for original grammar examples. No inference is performed at runtime.',
            '(() => {',
            '  const DATA = window.JLPT_DATA;',
            `  const rows = ${JSON.stringify(rows)};`,
            '  for (const [level,id,jp,covers] of rows) {',
            '    const item = (DATA.grammar[level] || []).find(x => x.id === id);',
            '    const ex = item?.examples?.find(x => x.jp === jp);',
            '    if (ex) ex.covers = covers;',
            '  }',
            '})();',
            ''
          ].join('\n');
          fs.writeFileSync('data/grammar-example-labels.js', out);
          console.log(`Materialized ${rows.length} exact grammar-example labels.`);
          NODE
          node --check data/grammar-example-labels.js
      - name: Commit static labels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/grammar-example-labels.js
          git commit -m 'content: materialize exact grammar example labels'
          git pull --rebase origin main
          git push origin HEAD:main
