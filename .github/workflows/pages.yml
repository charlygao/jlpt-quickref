name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static data policy and JavaScript
        run: |
          node --check app.js
          node --check compact-nav.js
          for file in data/*.js; do node --check "$file"; done

          test -s data/full-vocab.js
          test -s data/vocab-order.js
          test -s data/vocab-examples-review.js
          for level in n5 n4 n3 n2 n1; do
            test -s "data/vocab-examples-highfreq-${level}.js"
          done
          test -s data/grammar-examples-curated.js
          test -s data/grammar-example-labels.js
          test -s data/grammar-examples-review.js
          test -s data/grammar-terms.js
          test -s data/conjugation.js
          test -s FULL_VOCAB_NOTICE.md
          test -s FREQUENCY_NOTICE.md

          # Example sentences must be explicit reviewed data. Runtime/template
          # example generators are intentionally forbidden.
          test ! -e data/grammar-examples-auto.js
          if find data -maxdepth 1 -type f -iname '*examples-auto*.js' | grep -q .; then
            echo 'Automatic example file detected.' >&2
            exit 1
          fi
          if grep -nE '\.replace\(|function[[:space:]]+(variant|generate|makeExample)|Math\.random' data/vocab-examples-highfreq-*.js data/grammar-examples-curated.js data/grammar-example-labels.js; then
            echo 'Runtime example transformation/generation detected.' >&2
            exit 1
          fi

      - name: Validate reference data
        run: |
          node <<'NODE'
          global.window = {};
          [
            './data/base.js',
            './data/n5.js', './data/n4.js', './data/n3.js', './data/n2.js', './data/n1.js',
            './data/extra-base.js',
            './data/extra-n5.js', './data/extra-n4.js', './data/extra-n3.js', './data/extra-n2.js', './data/extra-n1.js',
            './data/full-vocab.js', './data/vocab-order.js',
            './data/vocab-examples-review.js',
            './data/vocab-examples-highfreq-n5.js', './data/vocab-examples-highfreq-n4.js',
            './data/vocab-examples-highfreq-n3.js', './data/vocab-examples-highfreq-n2.js',
            './data/vocab-examples-highfreq-n1.js',
            './data/grammar-terms.js', './data/conjugation.js',
            './data/grammar-examples-base.js',
            './data/grammar-examples-n5.js', './data/grammar-examples-n4.js', './data/grammar-examples-n3.js',
            './data/grammar-examples-n2.js', './data/grammar-examples-n1.js',
            './data/grammar-examples-curated.js', './data/grammar-example-labels.js', './data/grammar-examples-review.js'
          ].forEach(file => require(file));

          const data = window.JLPT_DATA;
          const levels = ['N5', 'N4', 'N3', 'N2', 'N1'];
          const minimumVocab = { N5: 650, N4: 620, N3: 1600, N2: 1700, N1: 3000 };
          let grammarTotal = 0;
          let vocabTotal = 0;
          let grammarExampleTotal = 0;
          let labeledGrammarExamples = 0;
          let detailedPosCount = 0;
          let reviewedVocabExamples = 0;
          let highFrequencyExamples = 0;
          const ids = new Set();
          const vocabExampleSentences = new Set();
          const detailedPosPattern = /五段动词|一段动词|サ变动词|カ变动词|名词・サ变|い形容词|な形容词|の形容词|自动词|他动词/;

          for (const level of levels) {
            const grammar = data.grammar[level] || [];
            const vocab = data.vocab[level] || [];
            grammarTotal += grammar.length;
            vocabTotal += vocab.length;
            detailedPosCount += vocab.filter(item => detailedPosPattern.test(item.pos || '')).length;

            if (vocab.length < minimumVocab[level]) {
              throw new Error(`${level} vocabulary coverage too small: ${vocab.length}`);
            }

            // Ranked items must be ordered from more frequent to less frequent.
            let previousRank = -Infinity;
            let reachedUnranked = false;
            for (const item of vocab) {
              const rank = item.frequencyRank;
              if (Number.isInteger(rank) && rank > 0) {
                if (reachedUnranked) throw new Error(`${level} ranked vocabulary appears after unranked item: ${item.word}`);
                if (rank < previousRank) throw new Error(`${level} frequency order regression at ${item.word}: ${rank} < ${previousRank}`);
                previousRank = rank;
              } else {
                reachedUnranked = true;
              }
            }

            // The highest-priority 100 cards of every level must have explicit,
            // reviewed examples. No fallback generation is allowed.
            if (vocab.length < 100) throw new Error(`${level} has fewer than 100 vocabulary entries`);
            const top100 = vocab.slice(0, 100);
            const topWords = new Set();
            for (const item of top100) {
              if (!Number.isInteger(item.frequencyRank) || item.frequencyRank <= 0) {
                throw new Error(`${level} top-100 item lacks entry frequency rank: ${item.word}`);
              }
              if (!item.example?.jp || !item.example?.zh || !item.example.reviewed) {
                throw new Error(`${level} top-100 item lacks reviewed example: ${item.word} (${item.id})`);
              }
              if (item.example.source !== 'high-frequency-curated') {
                throw new Error(`${level} top-100 example is not explicitly high-frequency curated: ${item.word}`);
              }
              if ([...item.example.jp].length < 9 || [...item.example.zh].length < 5) {
                throw new Error(`${level} top-100 example is too short to be useful: ${item.word}`);
              }
              const key = `${item.word}\u0000${item.reading}`;
              if (topWords.has(key)) throw new Error(`${level} duplicate top-100 vocabulary key: ${key}`);
              topWords.add(key);
              highFrequencyExamples += 1;
            }

            for (const item of grammar) {
              if (!item.id || !item.title || !item.connection) throw new Error(`Incomplete grammar item in ${level}`);
              if (!Array.isArray(item.examples) || item.examples.length < 2) {
                throw new Error(`Grammar needs at least 2 examples: ${item.id} ${item.title}`);
              }
              if (!item.examples[0]?.covers?.trim()) {
                throw new Error(`First grammar example has no connection label: ${item.id} ${item.title}`);
              }
              const firstCovers = item.examples[0].covers.trim();
              const hasBroadConnection = /[\/／]|普通形|形容词|→/.test(item.connection);
              if (hasBroadConnection && firstCovers === item.connection) {
                throw new Error(`First grammar example still uses broad connection metadata: ${item.id} ${item.title}`);
              }
              if (/[\/／]/.test(firstCovers)) {
                throw new Error(`First grammar example connection is not granular: ${item.id} ${firstCovers}`);
              }
              const jpSet = new Set();
              for (const ex of item.examples) {
                if (!ex?.jp || !ex?.zh || !ex.covers?.trim()) throw new Error(`Incomplete grammar example: ${item.id}`);
                if (/^补充(例|语境)$/.test(ex.covers)) throw new Error(`Mechanical grammar filler label: ${item.id}`);
                if (jpSet.has(ex.jp)) throw new Error(`Duplicate grammar example in ${item.id}: ${ex.jp}`);
                jpSet.add(ex.jp);
                labeledGrammarExamples += 1;
              }
              grammarExampleTotal += item.examples.length;
            }

            for (const item of vocab) {
              if (!item.example?.jp) continue;
              if (!item.example.zh || !item.example.reviewed) {
                throw new Error(`Unreviewed vocabulary example reached runtime data: ${item.id} ${item.word}`);
              }
              if (vocabExampleSentences.has(item.example.jp)) {
                throw new Error(`Duplicate vocabulary example sentence: ${item.example.jp}`);
              }
              vocabExampleSentences.add(item.example.jp);
              reviewedVocabExamples += 1;
            }

            for (const item of [...grammar, ...vocab]) {
              if (!item.id) throw new Error(`Missing id in ${level}`);
              if (ids.has(item.id)) throw new Error(`Duplicate id: ${item.id}`);
              ids.add(item.id);
            }

            console.log(`${level}: ${grammar.length} grammar, ${vocab.length} vocab, top100 examples OK`);
          }

          const terms = window.JLPT_TERMS?.terms || {};
          const requiredTerms = ['N','V','普通形','辞书形','ます形','Vて','Vた','Vない','ば形','可能形','意向形','被动形','使役形','命令形','い形','な形'];
          for (const term of requiredTerms) {
            if (!terms[term]?.summary || !(terms[term]?.rules || []).length) throw new Error(`Missing grammar term reference: ${term}`);
          }

          function vocabItem(level, word, reading) {
            return (data.vocab[level] || []).find(x => x.word === word && (!reading || x.reading === reading));
          }
          function expectPos(level, word, reading, pattern) {
            const item = vocabItem(level, word, reading);
            if (!item || !pattern.test(item.pos || '')) throw new Error(`Unexpected POS for ${level} ${word}: ${item?.pos || 'missing'}`);
          }
          expectPos('N5', '会う', 'あう', /五段动词.*自动词/);
          expectPos('N5', '開ける', 'あける', /一段动词.*他动词/);
          if (/动词/.test(vocabItem('N5', '秋', 'あき')?.pos || '')) throw new Error('秋 must not be classified as a verb');
          if (/动词/.test(vocabItem('N5', '朝', 'あさ')?.pos || '')) throw new Error('朝 must not be classified as a verb');

          const conjugation = window.JLPT_CONJUGATION;
          if (!conjugation?.rows) throw new Error('Conjugation reference is not loaded');
          function expectForm(item, label, expected) {
            const rows = conjugation.rows(item);
            if (rows.length < 10) throw new Error(`Too few conjugations for ${item.word}: ${rows.length}`);
            const actual = new Map(rows).get(label);
            if (actual !== expected) throw new Error(`${item.word} ${label}: expected ${expected}, got ${actual}`);
          }
          expectForm({word:'書く',reading:'かく',pos:'五段动词・他动词'}, 'て形', '書いて');
          expectForm({word:'食べる',reading:'たべる',pos:'一段动词・他动词'}, '可能形', '食べられる');
          expectForm({word:'勉強',reading:'べんきょう',pos:'名词・サ变'}, '辞书形', '勉強する');
          expectForm({word:'来る',reading:'くる',pos:'カ变动词・自动词'}, 'ない形', '来ない（こない）');

          console.log(`TOTAL: ${grammarTotal} grammar, ${grammarExampleTotal} grammar examples, ${vocabTotal} vocab, ${reviewedVocabExamples} reviewed vocab examples, ${highFrequencyExamples} top-frequency examples, ${detailedPosCount} detailed POS`);
          if (grammarTotal < 350) throw new Error(`Grammar coverage too small: ${grammarTotal}`);
          if (grammarExampleTotal < grammarTotal * 2) throw new Error(`Grammar example coverage too small: ${grammarExampleTotal}`);
          if (labeledGrammarExamples !== grammarExampleTotal) throw new Error(`Not every grammar example is labeled`);
          if (highFrequencyExamples !== 500) throw new Error(`Top-frequency example coverage mismatch: ${highFrequencyExamples}/500`);
          if (reviewedVocabExamples < 500) throw new Error(`Too few reviewed vocabulary examples: ${reviewedVocabExamples}`);
          if (vocabTotal < 7600) throw new Error(`Vocabulary coverage too small: ${vocabTotal}`);
          if (detailedPosCount < 1000) throw new Error(`Detailed POS coverage too small: ${detailedPosCount}`);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
