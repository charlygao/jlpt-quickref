name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check compact-nav.js
          for file in data/*.js; do node --check "$file"; done
          test -s data/full-vocab.js
          test -s data/vocab-examples-review.js
          test -s data/grammar-terms.js
          test -s data/conjugation.js
          test -s data/grammar-examples-base.js
          test -s data/grammar-examples-review.js
          test -s FULL_VOCAB_NOTICE.md

      - name: Validate reference data
        run: |
          node <<'NODE'
          global.window = {};
          [
            './data/base.js',
            './data/n5.js', './data/n4.js', './data/n3.js', './data/n2.js', './data/n1.js',
            './data/extra-base.js',
            './data/extra-n5.js', './data/extra-n4.js', './data/extra-n3.js', './data/extra-n2.js', './data/extra-n1.js',
            './data/full-vocab.js', './data/vocab-examples-review.js',
            './data/grammar-terms.js',
            './data/conjugation.js',
            './data/grammar-examples-base.js',
            './data/grammar-examples-n5.js', './data/grammar-examples-n4.js', './data/grammar-examples-n3.js',
            './data/grammar-examples-n2.js', './data/grammar-examples-n1.js',
            './data/grammar-examples-auto.js', './data/grammar-examples-review.js'
          ].forEach(file => require(file));

          const data = window.JLPT_DATA;
          const levels = ['N5', 'N4', 'N3', 'N2', 'N1'];
          const minimumVocab = { N5: 650, N4: 620, N3: 1600, N2: 1700, N1: 3000 };
          let grammarTotal = 0;
          let vocabTotal = 0;
          let exampleTotal = 0;
          let labeledExamples = 0;
          let detailedPosCount = 0;
          let reviewedVocabExamples = 0;
          const ids = new Set();
          const vocabExampleSentences = new Set();
          const detailedPosPattern = /五段动词|一段动词|サ变动词|カ变动词|名词・サ变|い形容词|な形容词|の形容词|自动词|他动词/;

          for (const level of levels) {
            const grammar = data.grammar[level] || [];
            const vocab = data.vocab[level] || [];
            grammarTotal += grammar.length;
            vocabTotal += vocab.length;
            detailedPosCount += vocab.filter(item => detailedPosPattern.test(item.pos || '')).length;

            if (vocab.length < minimumVocab[level]) {
              throw new Error(`${level} vocabulary coverage too small: ${vocab.length}`);
            }

            for (const item of grammar) {
              if (!item.id || !item.title || !item.connection) throw new Error(`Incomplete grammar item in ${level}`);
              if (!Array.isArray(item.examples) || item.examples.length < 2) {
                throw new Error(`Grammar needs at least 2 examples: ${item.id} ${item.title}`);
              }
              if (!item.examples[0]?.covers?.trim()) {
                throw new Error(`First grammar example has no connection label: ${item.id} ${item.title}`);
              }

              const jpSet = new Set();
              const labeledSentenceSet = new Set();
              for (const ex of item.examples) {
                if (!ex?.jp || !ex?.zh) throw new Error(`Incomplete example: ${item.id}`);
                if (!ex.covers?.trim()) throw new Error(`Unlabeled grammar example: ${item.id} ${ex.jp}`);
                if (/^补充(例|语境)$/.test(ex.covers)) {
                  throw new Error(`Mechanical filler label is forbidden: ${item.id} ${ex.jp}`);
                }
                if (/^老师说[：:“]/.test(ex.zh) && !/と言/.test(item.title)) {
                  throw new Error(`Quotation-wrapper filler detected: ${item.id} ${ex.jp}`);
                }
                if (jpSet.has(ex.jp)) throw new Error(`Duplicate example in ${item.id}: ${ex.jp}`);
                jpSet.add(ex.jp);
                const labeledSentence = `${ex.covers}\u0000${ex.jp}`;
                if (labeledSentenceSet.has(labeledSentence)) throw new Error(`Duplicate labeled example in ${item.id}: ${ex.jp}`);
                labeledSentenceSet.add(labeledSentence);
                labeledExamples += 1;
              }
              exampleTotal += item.examples.length;
            }

            let reviewedInLevel = 0;
            for (const item of vocab) {
              if (!/^v-n[1-5]-\d+$/.test(item.id)) continue;
              if (!item.example?.jp || !item.example?.zh) throw new Error(`Missing curated vocabulary example: ${item.id} ${item.word}`);
              if (!item.example.reviewed) throw new Error(`Vocabulary example was not reviewed: ${item.id} ${item.word}`);
              if ([...item.example.jp].length < 12) throw new Error(`Vocabulary example is too short to be useful: ${item.id} ${item.example.jp}`);
              if ([...item.example.zh].length < 6) throw new Error(`Vocabulary translation is too short: ${item.id} ${item.example.zh}`);
              if (vocabExampleSentences.has(item.example.jp)) throw new Error(`Duplicate vocabulary example: ${item.example.jp}`);
              vocabExampleSentences.add(item.example.jp);
              reviewedVocabExamples += 1;
              reviewedInLevel += 1;
            }
            if (reviewedInLevel !== 35) throw new Error(`${level} reviewed curated vocabulary examples: expected 35, got ${reviewedInLevel}`);

            for (const item of [...grammar, ...vocab]) {
              if (!item.id) throw new Error(`Missing id in ${level}`);
              if (ids.has(item.id)) throw new Error(`Duplicate id: ${item.id}`);
              ids.add(item.id);
            }

            console.log(`${level}: ${grammar.length} grammar, ${vocab.length} vocab, ${grammar.reduce((n,x)=>n+x.examples.length,0)} grammar examples, ${reviewedInLevel} reviewed vocab examples`);
          }

          const terms = window.JLPT_TERMS?.terms || {};
          const requiredTerms = ['N','V','普通形','辞书形','ます形','Vて','Vた','Vない','ば形','可能形','意向形','被动形','使役形','命令形','い形','な形'];
          for (const term of requiredTerms) {
            if (!terms[term]?.summary || !(terms[term]?.rules || []).length) throw new Error(`Missing grammar term reference: ${term}`);
          }

          function vocab(level, word, reading) {
            return (data.vocab[level] || []).find(x => x.word === word && (!reading || x.reading === reading));
          }
          function expectPos(level, word, reading, pattern) {
            const item = vocab(level, word, reading);
            if (!item || !pattern.test(item.pos || '')) {
              throw new Error(`Unexpected POS for ${level} ${word}: ${item?.pos || 'missing'}`);
            }
          }
          expectPos('N5', '会う', 'あう', /五段动词.*自动词/);
          expectPos('N5', '開ける', 'あける', /一段动词.*他动词/);
          expectPos('N5', '秋', 'あき', /名词|の形容词/);
          if (/动词/.test(vocab('N5', '秋', 'あき')?.pos || '')) throw new Error('秋 must not be classified as a verb');
          if (/动词/.test(vocab('N5', '朝', 'あさ')?.pos || '')) throw new Error('朝 must not be classified as a verb');
          if (/动词/.test(vocab('N5', '明日', 'あした')?.pos || '')) throw new Error('明日 must not be classified as a verb');

          const conjugation = window.JLPT_CONJUGATION;
          if (!conjugation?.rows) throw new Error('Conjugation reference is not loaded');
          function asMap(item) {
            return new Map(conjugation.rows(item));
          }
          function expectForm(item, label, expected) {
            const rows = conjugation.rows(item);
            if (rows.length < 10) throw new Error(`Too few conjugations for ${item.word}: ${rows.length}`);
            const actual = new Map(rows).get(label);
            if (actual !== expected) throw new Error(`${item.word} ${label}: expected ${expected}, got ${actual}`);
          }
          expectForm({word:'書く',reading:'かく',pos:'五段动词・他动词'}, 'て形', '書いて');
          expectForm({word:'書く',reading:'かく',pos:'五段动词・他动词'}, 'ませんでした', '書きませんでした');
          expectForm({word:'食べる',reading:'たべる',pos:'一段动词・他动词'}, '可能形', '食べられる');
          expectForm({word:'勉強',reading:'べんきょう',pos:'名词・サ变'}, '辞书形', '勉強する');
          expectForm({word:'来る',reading:'くる',pos:'カ变动词・自动词'}, 'ない形', '来ない（こない）');
          expectForm({word:'高い',reading:'たかい',pos:'い形容词'}, '礼貌过去否定', '高くなかったです／高くありませんでした');
          expectForm({word:'静か',reading:'しずか',pos:'な形容词'}, '连体形', '静かな + N');
          if (asMap({word:'書く',reading:'かく',pos:'五段动词'}).size < 20) throw new Error('Comprehensive verb conjugation list is too small');

          console.log(`TOTAL: ${grammarTotal} grammar, ${exampleTotal} grammar examples (${labeledExamples} labeled), ${vocabTotal} vocab, ${reviewedVocabExamples} reviewed vocab examples, ${detailedPosCount} detailed POS`);
          if (grammarTotal < 350) throw new Error(`Grammar coverage too small: ${grammarTotal}`);
          if (exampleTotal < grammarTotal * 2) throw new Error(`Grammar example coverage too small: ${exampleTotal}`);
          if (labeledExamples !== exampleTotal) throw new Error(`Not every grammar example is labeled: ${labeledExamples}/${exampleTotal}`);
          if (reviewedVocabExamples !== 175) throw new Error(`Reviewed vocabulary example coverage mismatch: ${reviewedVocabExamples}/175`);
          if (vocabTotal < 7600) throw new Error(`Vocabulary coverage too small: ${vocabTotal}`);
          if (detailedPosCount < 1000) throw new Error(`Detailed POS coverage too small: ${detailedPosCount}`);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
