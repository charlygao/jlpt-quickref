name: Patch conjugation integration

on:
  push:
    paths:
      - '.github/workflows/patch-conjugation.yml'
      - 'scripts/patch_app_conjugation.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Integrate comprehensive conjugation library
        run: |
          python3 scripts/patch_app_conjugation.py
          node --check app.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: use comprehensive conjugation tables'
          git push
