name: Patch conjugation integration

on:
  push:
    paths:
      - '.github/workflows/patch-conjugation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Integrate comprehensive conjugation library
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = """  function conjugationRows(item) {
    const type = detailedType(item);
    const word = String(item.word || '');
    const klass = inferVerbClass(item);
    if (type.includes('名词・サ变') || klass === 'suru-noun') return suruForms(word, true);
    if (klass === 'godan') return godanForms(word) || [];
    if (klass === 'ichidan') return ichidanForms(word);
    if (klass === 'suru') return suruForms(word, false);
    if (klass === 'kuru') return kuruForms(word);
    if (type.includes('い形容词')) return iAdjectiveForms(word);
    if (type.includes('な形容词')) return naAdjectiveForms(word);
    return [];
  }
"""
          new = """  function conjugationRows(item) {
    if (window.JLPT_CONJUGATION?.rows) return window.JLPT_CONJUGATION.rows(item);
    const type = detailedType(item);
    const word = String(item.word || '');
    const klass = inferVerbClass(item);
    if (type.includes('名词・サ变') || klass === 'suru-noun') return suruForms(word, true);
    if (klass === 'godan') return godanForms(word) || [];
    if (klass === 'ichidan') return ichidanForms(word);
    if (klass === 'suru') return suruForms(word, false);
    if (klass === 'kuru') return kuruForms(word);
    if (type.includes('い形容词')) return iAdjectiveForms(word);
    if (type.includes('な形容词')) return naAdjectiveForms(word);
    return [];
  }
"""
          if old not in text:
              if 'window.JLPT_CONJUGATION?.rows' in text:
                  print('Integration already present.')
              else:
                  raise SystemExit('Expected conjugationRows block not found')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check app.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: use comprehensive conjugation tables'
          git push
